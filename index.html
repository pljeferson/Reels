<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reels</title>
<style>
  /* ===== AJUSTES SIMPLES ===== */
  :root {
    --espaco: 2px;          /* espaço entre os reels (0px = colados) */
    --fundo-reel: #111;     /* cor enquanto o vídeo carrega */
  }
  /* =========================== */

  html, body {
    margin: 0; padding: 0;
    background: transparent;
    -webkit-tap-highlight-color: transparent;
  }
  body.desktop { height: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  html { height: 100%; }

  #grelha {
    display: flex; flex-wrap: wrap; justify-content: center;
    align-items: flex-start; align-content: flex-start;
    gap: var(--espaco);
  }
  body.telemovel #grelha { width: 100%; }

  .reel {
    position: relative;
    flex: 0 0 auto;
    overflow: hidden;
    background: var(--fundo-reel) center / cover no-repeat;
    cursor: pointer;
  }
  .reel video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    pointer-events: none;
  }
  /* ícone de som (só aparece ao passar o rato ou quando o som está ligado) */
  .som {
    position: absolute; right: 6px; bottom: 6px;
    width: 26px; height: 26px; border-radius: 50%;
    background: rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .2s;
  }
  .som svg { width: 14px; height: 14px; fill: #fff; }
  .reel:hover .som, .reel.ativo .som { opacity: 1; }
  .reel .on { display: none; }
  .reel.ativo .on { display: block; }
  .reel.ativo .off { display: none; }
  .reel.ativo { outline: 2px solid #fff; outline-offset: -2px; }

  #aviso { color: #888; font: 14px -apple-system, sans-serif; text-align: center; padding: 20px; }
</style>
</head>
<body>
<div id="grelha"></div>

<script>
  const COLUNAS_TELEMOVEL = 3;   // colunas no telemóvel (scroll para baixo)
  const LARGURA_TELEMOVEL = 700; // abaixo desta largura conta como telemóvel
  const MAX_COLUNAS = 0;         // desktop: 0 = a página escolhe sozinha

  const grelha = document.getElementById('grelha');
  const ICON_OFF = '<svg class="off" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/></svg>';
  const ICON_ON  = '<svg class="on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
  let total = 0, ativo = null;

  function criarReel(linha) {
    let src = linha;
    if (!/^https?:\/\//.test(src) && !src.includes('/')) src = 'reels/' + src;
    const nome = src.split('/').pop().replace(/\.[^.]+$/, '');
    const preview = 'previews/' + encodeURIComponent(nome) + '.mp4';
    const completo = encodeURI(src);

    const div = document.createElement('div');
    div.className = 'reel';
    div.style.backgroundImage = "url('posters/" + encodeURIComponent(nome) + ".jpg')";

    const v = document.createElement('video');
    v.muted = true; v.defaultMuted = true;
    v.loop = true; v.autoplay = true; v.playsInline = true;
    v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
    v.preload = 'auto';
    v.src = preview;
    // se não houver versão leve, usa o vídeo completo
    v.addEventListener('error', () => { if (!v.dataset.fallback) { v.dataset.fallback = 1; v.src = completo; v.play().catch(()=>{}); } });

    div.dataset.preview = preview;
    div.dataset.completo = completo;
    div.appendChild(v);
    div.insertAdjacentHTML('beforeend', '<div class="som">' + ICON_OFF + ICON_ON + '</div>');
    div.addEventListener('click', () => alternarSom(div));
    return div;
  }

  // Volta um reel ao modo pré-visualização (sem som, em loop)
  function desligar(div) {
    const v = div.querySelector('video');
    div.classList.remove('ativo');
    v.muted = true; v.loop = true;
    v.src = v.dataset.fallback ? div.dataset.completo : div.dataset.preview;
    v.play().catch(()=>{});
  }

  // Clique: liga o som desse reel (versão completa, desde o início); clica outra vez para desligar
  function alternarSom(div) {
    if (ativo === div) { desligar(div); ativo = null; return; }
    if (ativo) desligar(ativo);
    const v = div.querySelector('video');
    div.classList.add('ativo');
    v.loop = false;
    v.src = div.dataset.completo;
    v.muted = false;
    v.play().catch(() => { v.muted = true; v.play(); });
    v.onended = () => { if (ativo === div) { desligar(div); ativo = null; } };
    ativo = div;
  }

  function ajustar() {
    if (!total) return;
    const W = document.documentElement.clientWidth, H = window.innerHeight;
    const G = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--espaco')) || 0;
    let c, w;
    if (W < LARGURA_TELEMOVEL) {
      document.body.className = 'telemovel';
      c = COLUNAS_TELEMOVEL;
      w = (W - G * (c - 1)) / c;
    } else {
      document.body.className = 'desktop';
      const limite = MAX_COLUNAS > 0 ? Math.min(MAX_COLUNAS, total) : total;
      let melhor = { c: 1, w: 0 };
      for (let k = 1; k <= limite; k++) {
        const linhas = Math.ceil(total / k);
        const porLargura = (W - G * (k - 1)) / k;
        const porAltura = ((H - G * (linhas - 1)) / linhas) * 9 / 16;
        const x = Math.floor(Math.min(porLargura, porAltura));
        if (x > melhor.w) melhor = { c: k, w: x };
      }
      c = melhor.c; w = melhor.w;
    }
    const h = w * 16 / 9;
    document.querySelectorAll('.reel').forEach(r => { r.style.width = w + 'px'; r.style.height = h + 'px'; });
    grelha.style.width = (c * w + G * (c - 1)) + 'px';
  }

  // Poupa bateria: só toca o que está visível no ecrã
  const obs = 'IntersectionObserver' in window ? new IntersectionObserver(entradas => {
    entradas.forEach(e => {
      const v = e.target.querySelector('video');
      if (e.isIntersecting) v.play().catch(()=>{});
      else if (e.target !== ativo) v.pause();
    });
  }, { rootMargin: '200px' }) : null;

  fetch('reels.txt?v=' + Date.now())
    .then(r => r.text())
    .then(txt => {
      const linhas = txt.split(/\r?\n/).map(l => l.trim()).filter(l => l && !l.startsWith('#'));
      total = linhas.length;
      if (!total) { grelha.innerHTML = '<div id="aviso">Ainda não há reels no reels.txt.</div>'; return; }
      linhas.forEach(l => {
        const d = criarReel(l);
        grelha.appendChild(d);
        if (obs) obs.observe(d);
      });
      ajustar();
      document.querySelectorAll('video').forEach(v => v.play().catch(()=>{}));
    })
    .catch(() => { grelha.innerHTML = '<div id="aviso">Não consegui ler o reels.txt.</div>'; });

  window.addEventListener('resize', ajustar);
  // alguns browsers só deixam tocar depois do 1.º toque
  document.addEventListener('touchstart', () => document.querySelectorAll('video').forEach(v => { if (v.paused) v.play().catch(()=>{}); }), { once: true, passive: true });
</script>
</body>
</html>
