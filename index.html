<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeferson Pereira — Reels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  /* ===== AJUSTES SIMPLES ===== */
  :root {
    --espaco: 2px;          /* espaço entre os reels (0px = colados) */
    --fundo: #111;          /* fundo da página (igual ao Portfolio) */
    --cinza: #aeaeae;       /* cor dos links do menu */
  }
  /* =========================== */

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--fundo); color: #fff; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Bebas Neue', 'Oswald', 'Arial Narrow', sans-serif; }
  a { color: inherit; text-decoration: none; }

  /* Cabeçalho igual ao Portfolio */
  header {
    height: 160px; padding: 0 4% 6px;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 20px;
  }
  nav { display: flex; flex-wrap: wrap; column-gap: 22px; row-gap: 4px; font-size: 20px; text-transform: uppercase; letter-spacing: .01em; }
  nav a { color: var(--cinza); transition: color .2s; }
  nav a:hover, nav a.ativo { color: #fff; }
  .logo { font-size: 37px; text-transform: uppercase; white-space: nowrap; text-align: center; }

  main { padding: 0 4% 60px; }
  #grelha { display: grid; gap: var(--espaco); }

  .reel { position: relative; aspect-ratio: 9 / 16; overflow: hidden; cursor: pointer; background: #1a1a1a center / cover no-repeat; }
  @supports not (aspect-ratio: 9 / 16) { .reel { height: 0; padding-top: 177.78%; } }
  .reel video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }

  .som { position: absolute; right: 6px; bottom: 6px; width: 26px; height: 26px; border-radius: 50%;
         background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .2s; }
  .som svg { width: 14px; height: 14px; fill: #fff; }
  .reel:hover .som, .reel.ativo .som { opacity: 1; }
  .reel .on { display: none; } .reel.ativo .on { display: block; } .reel.ativo .off { display: none; }
  .reel.ativo { outline: 2px solid #fff; outline-offset: -2px; }

  /* Telemóvel */
  @media (max-width: 700px) {
    header { height: auto; padding: 28px 15px 22px; display: flex; flex-direction: column; gap: 14px; }
    .logo { font-size: 32px; order: -1; }
    nav { justify-content: center; font-size: 17px; column-gap: 16px; }
    main { padding: 0 0 40px; }
  }
  #aviso { color: #888; text-align: center; padding: 40px; font-family: -apple-system, sans-serif; }

  .reel { touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .expandir { position: absolute; right: 6px; top: 6px; width: 26px; height: 26px; border-radius: 50%;
              background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center;
              opacity: 0; transition: opacity .2s; cursor: zoom-in; }
  .expandir svg { width: 13px; height: 13px; fill: #fff; }
  .reel:hover .expandir, .reel.ativo .expandir { opacity: 1; }
  @media (hover: none) { .reel:hover .som, .reel:hover .expandir { opacity: 0; } .reel.ativo .som, .reel.ativo .expandir { opacity: 1; } }

  /* Dica (aparece uma vez) */
  #dica { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 50;
          background: rgba(0,0,0,.8); color: #fff; font: 13px/1.4 -apple-system, sans-serif; padding: 10px 16px;
          border-radius: 20px; white-space: nowrap; transition: opacity .5s; pointer-events: none; }

  /* ===== Visualizador em ecrã inteiro ===== */
  #ver { position: fixed; inset: 0; z-index: 100; background: #000; display: none; touch-action: none;
         font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  #ver.aberto { display: block; }
  #ver video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #ver .topo { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between;
               padding: max(14px, env(safe-area-inset-top)) 16px 30px; background: linear-gradient(rgba(0,0,0,.6), transparent); z-index: 2; }
  #ver button { background: none; border: 0; color: #fff; cursor: pointer; padding: 6px; display: flex; align-items: center; gap: 6px;
                font: 600 14px -apple-system, sans-serif; }
  #ver button svg { width: 22px; height: 22px; fill: #fff; }
  #ver .contador { color: rgba(255,255,255,.8); font-size: 13px; }
  #ver .baixo { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 18px max(28px, calc(env(safe-area-inset-bottom) + 14px));
                background: linear-gradient(transparent, rgba(0,0,0,.75)); z-index: 2; display: flex; align-items: center; gap: 12px; }
  /* Barra de progresso: visível, bolinha vermelha, arrastável */
  #barra { flex: 1; position: relative; height: 32px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
  #barra .trilho { position: relative; width: 100%; height: 5px; border-radius: 3px; background: rgba(255,255,255,.45);
                   box-shadow: 0 0 6px rgba(0,0,0,.6); transition: height .15s; }
  #barra .cheio { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 3px; background: #ff1f3d; }
  #barra .bola { position: absolute; top: 50%; left: 0; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
                 background: #ff1f3d; box-shadow: 0 0 0 3px rgba(255,255,255,.9), 0 2px 6px rgba(0,0,0,.6); transition: transform .15s; }
  #barra.arrastar .trilho, #barra:hover .trilho { height: 7px; }
  #barra.arrastar .bola { transform: scale(1.35); }
  #ver .tempo { color: #fff; font-size: 13px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,.8); min-width: 70px; text-align: right; font-variant-numeric: tabular-nums; }
  #ver .seta { position: absolute; right: 28px; z-index: 2; width: 48px; height: 48px; justify-content: center;
               border-radius: 50%; background: rgba(255,255,255,.14); transition: background .2s; }
  #ver .seta:hover { background: rgba(255,255,255,.3); }
  #ver .seta.cima { top: calc(50% - 56px); } #ver .seta.baixo-s { top: calc(50% + 8px); }
  #ver .seta svg { width: 30px; height: 30px; }
  @media (hover: hover) { #ver .baixo { padding-left: max(16px, calc(50% - 300px)); padding-right: max(16px, calc(50% - 300px)); } }
  #ver .pausa { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 70px; height: 70px; border-radius: 50%;
                background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; pointer-events: none; z-index: 2; }
  #ver .pausa svg { width: 30px; height: 30px; fill: #fff; }
  #ver.parado .pausa { display: flex; }
  @media (hover: none) { #ver .seta { display: none; } }
</style>
</head>
<body>
<header>
  <nav>
    <a href="https://pljotalopes.myportfolio.com/work">Work</a>
    <a href="https://pljeferson.github.io/Reels/" class="ativo">Reels (Vertical Content)</a>
    <a href="https://pljotalopes.myportfolio.com/contact">Contact</a>
  </nav>
  <a class="logo" href="https://pljotalopes.myportfolio.com/work">Jeferson Pereira</a>
</header>
<main><div id="grelha"></div></main>

<div id="ver" aria-hidden="true">
  <video playsinline webkit-playsinline></video>
  <div class="pausa"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
  <div class="topo">
    <button id="fechar" title="Voltar a todos os reels (Esc)"><svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>Todos os reels</button>
    <span class="contador" id="contador"></span>
    <button id="somVer" title="Som (M)"></button>
  </div>
  <button class="seta cima" id="ant" title="Anterior (↑)"><svg viewBox="0 0 24 24"><path d="M7.4 15.4 12 10.8l4.6 4.6L18 14l-6-6-6 6z"/></svg></button>
  <button class="seta baixo-s" id="seg" title="Seguinte (↓)"><svg viewBox="0 0 24 24"><path d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg></button>
  <div class="baixo">
    <div id="barra" role="slider" aria-label="Progresso do vídeo"><div class="trilho"><div class="cheio"></div><div class="bola"></div></div></div>
    <span class="tempo" id="tempo">0:00 / 0:00</span>
  </div>
</div>
<div id="dica" style="opacity:0"></div>

<script>
  const COLUNAS_TELEMOVEL = 3;    // colunas no telemóvel
  const LARGURA_REEL_DESKTOP = 165; // largura aproximada de cada reel no computador (px)

  const grelha = document.getElementById('grelha');
  const ICON_OFF = '<svg class="off" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/></svg>';
  const ICON_ON  = '<svg class="on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
  const ICON_EXP = '<svg viewBox="0 0 24 24"><path d="M3 3h7v2H5v5H3V3zm11 0h7v7h-2V5h-5V3zM3 14h2v5h5v2H3v-7zm16 0h2v7h-7v-2h5v-5z"/></svg>';
  let ativo = null;
  const lista = [];

  function colunas() {
    const w = grelha.clientWidth || window.innerWidth;
    const c = window.innerWidth <= 700 ? COLUNAS_TELEMOVEL : Math.max(4, Math.round(w / LARGURA_REEL_DESKTOP));
    grelha.style.gridTemplateColumns = 'repeat(' + c + ', 1fr)';
  }

  function criarReel(linha) {
    let src = linha;
    if (!/^https?:\/\//.test(src) && !src.includes('/')) src = 'reels/' + src;
    const nome = src.split('/').pop().replace(/\.[^.]+$/, '');
    const div = document.createElement('div');
    div.className = 'reel';
    div.style.backgroundImage = "url('posters/" + encodeURIComponent(nome) + ".jpg')";
    div.dataset.preview = 'previews/' + encodeURIComponent(nome) + '.mp4';
    div.dataset.completo = encodeURI(src);

    const v = document.createElement('video');
    v.muted = true; v.defaultMuted = true; v.loop = true; v.playsInline = true;
    v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
    v.preload = 'none';
    v.addEventListener('error', () => {   // sem versão leve -> usa o vídeo completo
      if (v.src && !div.dataset.fallback) { div.dataset.fallback = 1; v.src = div.dataset.completo; v.play().catch(()=>{}); }
    });
    div.appendChild(v);
    div.insertAdjacentHTML('beforeend', '<div class="som">' + ICON_OFF + ICON_ON + '</div><div class="expandir" title="Ecrã inteiro">' + ICON_EXP + '</div>');
    div.querySelector('.expandir').addEventListener('click', ev => { ev.stopPropagation(); abrirVer(lista.indexOf(div)); });
    div.addEventListener('click', e => toque(div, e));
    return div;
  }

  function srcPreview(div) { return div.dataset.fallback ? div.dataset.completo : div.dataset.preview; }

  // Som liga/desliga no próprio vídeo que já está a tocar (sem trocar de ficheiro = sem cortes)
  function desligar(div) {
    div.classList.remove('ativo');
    div.querySelector('video').muted = true;
  }

  function alternarSom(div) {
    if (ativo === div) { desligar(div); ativo = null; return; }
    if (ativo) desligar(ativo);
    const v = div.querySelector('video');
    if (!v.getAttribute('src')) v.src = srcPreview(div);
    div.classList.add('ativo');
    v.muted = false;
    if (v.paused) v.play().catch(() => { v.muted = true; div.classList.remove('ativo'); });
    ativo = div;
  }

  // ===== Carregamento inteligente =====
  // 1) toca o que está no ecrã; 2) em segundo plano pré-carrega os próximos (até ~3 ecrãs abaixo),
  //    poucos de cada vez e por ordem, para que já estejam prontos quando se faz scroll.
  const EM_PARALELO = 6;
  const fila = [], aCarregar = new Set(), visiveis = new Set();

  function carregarTile(div) {
    const v = div.querySelector('video');
    if (v.getAttribute('src')) return false;
    v.preload = 'auto';
    v.src = srcPreview(div);
    aCarregar.add(div);
    const pronto = () => { aCarregar.delete(div); v.removeEventListener('canplay', pronto); v.removeEventListener('error', pronto);
                           if (visiveis.has(div)) v.play().catch(()=>{}); proximoDaFila(); };
    v.addEventListener('canplay', pronto); v.addEventListener('error', pronto);
    setTimeout(() => { if (aCarregar.has(div)) pronto(); }, 8000);   // não bloquear a fila
    return true;
  }
  function proximoDaFila() {
    while (aCarregar.size < EM_PARALELO && fila.length) {
      // prioridade: os visíveis primeiro, depois os mais perto do topo do ecrã
      fila.sort((x, y) => (visiveis.has(y) - visiveis.has(x)) || (x.getBoundingClientRect().top - y.getBoundingClientRect().top));
      carregarTile(fila.shift());
    }
  }
  function porNaFila(div) { if (!div.querySelector('video').getAttribute('src') && !fila.includes(div) && !aCarregar.has(div)) fila.push(div); }

  // Visibilidade real: tocar / pausar
  const obs = new IntersectionObserver(entradas => {
    entradas.forEach(e => {
      const div = e.target, v = div.querySelector('video');
      if (e.isIntersecting) {
        visiveis.add(div);
        if (!v.getAttribute('src')) { porNaFila(div); }
        else v.play().catch(()=>{});
      } else { visiveis.delete(div); if (div !== ativo) v.pause(); }
    });
    proximoDaFila();
  }, { rootMargin: '150px 0px' });

  // Zona de pré-carga: até 3 ecrãs abaixo do que se vê
  const obsPre = new IntersectionObserver(entradas => {
    entradas.forEach(e => { if (e.isIntersecting) porNaFila(e.target); });
    proximoDaFila();
  }, { rootMargin: '0px 0px 300% 0px' });

  fetch('reels.txt?v=' + Date.now())
    .then(r => r.text())
    .then(txt => {
      const linhas = txt.split(/\r?\n/).map(l => l.trim()).filter(l => l && !l.startsWith('#'));
      if (!linhas.length) { grelha.innerHTML = '<div id="aviso">Ainda não há reels no reels.txt.</div>'; return; }
      colunas();
      linhas.forEach(l => { const d = criarReel(l); lista.push(d); grelha.appendChild(d); obs.observe(d); obsPre.observe(d); });
      mostrarDica();
    })
    .catch(() => { grelha.innerHTML = '<div id="aviso">Não consegui ler o reels.txt.</div>'; });


  /* ===== 1 toque = som on/off · 2 toques rápidos = ecrã inteiro ===== */
  let ultimo = { div: null, t: 0 };
  function toque(div, e) {
    const agora = (e && e.timeStamp) || performance.now();   // hora real do toque (não atrasa se a página estiver ocupada)
    if (ultimo.div === div && agora - ultimo.t < 320) {   // duplo toque
      ultimo = { div: null, t: 0 };
      if (ativo) { desligar(ativo); ativo = null; }
      abrirVer(lista.indexOf(div));
      return;
    }
    ultimo = { div, t: agora };
    alternarSom(div);                                    // resposta imediata ao 1.º toque
  }

  /* ===== Visualizador ===== */
  const ver = document.getElementById('ver'), vv = ver.querySelector('video');
  const barra = document.getElementById('barra'), tempo = document.getElementById('tempo');
  const contador = document.getElementById('contador'), somVer = document.getElementById('somVer');
  const SVG_ON = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
  const SVG_OFF = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/></svg>';
  let idx = -1, aArrastar = false, preCarga = null;

  const fmt = t => isFinite(t) ? Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0') : '0:00';
  function atualizarSom() { somVer.innerHTML = vv.muted ? SVG_OFF : SVG_ON; }

  function carregar(i, desde) {
    idx = (i + lista.length) % lista.length;
    vv.src = lista[idx].dataset.completo;
    if (desde) vv.addEventListener('loadedmetadata', () => { try { vv.currentTime = desde; } catch (e) {} }, { once: true });
    vv.poster = lista[idx].style.backgroundImage.slice(5, -2);
    contador.textContent = (idx + 1) + ' / ' + lista.length;
    pintar(0);
    vv.play().catch(() => { vv.muted = true; atualizarSom(); vv.play().catch(()=>{}); });
    // pré-carrega o seguinte
    preCarga = document.createElement('video'); preCarga.preload = 'auto'; preCarga.muted = true;
    preCarga.src = lista[(idx + 1) % lista.length].dataset.completo;
  }

  function abrirVer(i) {
    if (i < 0) return;
    document.querySelectorAll('#grelha video').forEach(v => v.pause());
    ver.classList.add('aberto'); ver.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    vv.muted = false; atualizarSom();
    const t = lista[i].querySelector('video').currentTime || 0;
    carregar(i, t > 0.3 ? t : 0);
    if (!history.state || !history.state.ver) history.pushState({ ver: 1 }, '');
  }

  function fecharVer(viaHistorico) {
    if (!ver.classList.contains('aberto')) return;
    const tFim = vv.currentTime, tile0 = lista[idx];
    vv.pause(); vv.removeAttribute('src'); vv.load();
    if (tile0) { const tv = tile0.querySelector('video'); if (tv.getAttribute('src')) { try { tv.currentTime = tFim; } catch (e) {} } }
    ver.classList.remove('aberto', 'parado'); ver.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    const tile = lista[idx]; if (tile) tile.scrollIntoView({ block: 'nearest' });
    document.querySelectorAll('#grelha video[src]').forEach(v => v.play().catch(()=>{}));
    if (!viaHistorico && history.state && history.state.ver) history.back();
  }
  window.addEventListener('popstate', () => fecharVer(true));   // botão "voltar" do telemóvel/browser

  const proximo = () => carregar(idx + 1), anterior = () => carregar(idx - 1);
  function pausar() { if (vv.paused) vv.play(); else vv.pause(); }
  vv.addEventListener('play', () => ver.classList.remove('parado'));
  vv.addEventListener('pause', () => { if (ver.classList.contains('aberto')) ver.classList.add('parado'); });
  vv.addEventListener('ended', proximo);                       // no fim, passa ao seguinte
  vv.addEventListener('timeupdate', () => {
    if (!aArrastar && vv.duration) pintar(vv.currentTime / vv.duration);
    tempo.textContent = fmt(vv.currentTime) + ' / ' + fmt(vv.duration);
  });

  const cheio = barra.querySelector('.cheio'), bola = barra.querySelector('.bola'), trilho = barra.querySelector('.trilho');
  function pintar(f) { f = Math.min(1, Math.max(0, f || 0)); cheio.style.width = (f * 100) + '%'; bola.style.left = (f * 100) + '%'; }
  function posicao(e) { const r = trilho.getBoundingClientRect(); return (e.clientX - r.left) / r.width; }
  function saltar(e) { const f = Math.min(1, Math.max(0, posicao(e))); pintar(f);
    if (vv.duration) { vv.currentTime = f * vv.duration; tempo.textContent = fmt(vv.currentTime) + ' / ' + fmt(vv.duration); } }
  barra.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); aArrastar = true; barra.classList.add('arrastar');
    try { barra.setPointerCapture(e.pointerId); } catch (_) {} saltar(e); });
  barra.addEventListener('pointermove', e => { if (aArrastar) { e.preventDefault(); saltar(e); } });
  const soltar = e => { if (!aArrastar) return; aArrastar = false; barra.classList.remove('arrastar');
    try { barra.releasePointerCapture(e.pointerId); } catch (_) {} if (vv.paused && ver.classList.contains('aberto')) vv.play().catch(()=>{}); };
  barra.addEventListener('pointerup', soltar); barra.addEventListener('pointercancel', soltar);
  ['touchstart', 'touchend', 'click'].forEach(ev => barra.addEventListener(ev, e => e.stopPropagation(), { passive: true }));

  document.getElementById('fechar').addEventListener('click', ev => { ev.stopPropagation(); fecharVer(false); });
  document.getElementById('seg').addEventListener('click', ev => { ev.stopPropagation(); proximo(); });
  document.getElementById('ant').addEventListener('click', ev => { ev.stopPropagation(); anterior(); });
  somVer.addEventListener('click', ev => { ev.stopPropagation(); vv.muted = !vv.muted; atualizarSom(); });

  // Telemóvel: deslizar ↑ seguinte, ↓ anterior · toque = pausa
  let ini = null;
  vv.addEventListener('touchstart', e => { ini = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() }; }, { passive: true });
  vv.addEventListener('touchend', e => {
    if (!ini) return;
    const dx = e.changedTouches[0].clientX - ini.x, dy = e.changedTouches[0].clientY - ini.y;
    if (Math.abs(dy) > 50 && Math.abs(dy) > Math.abs(dx)) { dy < 0 ? proximo() : anterior(); }
    else if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) { dx < 0 ? proximo() : anterior(); }
    else if (Math.abs(dx) < 10 && Math.abs(dy) < 10) pausar();
    ini = null; e.preventDefault();
  });
  // Computador: clique = pausa · roda do rato = mudar de reel
  vv.addEventListener('click', () => { if (!('ontouchstart' in window)) pausar(); });
  let rodaT = 0;
  ver.addEventListener('wheel', e => {
    e.preventDefault();
    if (Date.now() - rodaT < 600 || Math.abs(e.deltaY) < 15) return;
    rodaT = Date.now(); e.deltaY > 0 ? proximo() : anterior();
  }, { passive: false });
  // Teclado
  document.addEventListener('keydown', e => {
    if (!ver.classList.contains('aberto')) return;
    if (e.key === 'Escape') fecharVer(false);
    else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); proximo(); }
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); anterior(); }
    else if (e.key === ' ') { e.preventDefault(); pausar(); }
    else if (e.key.toLowerCase() === 'm') { vv.muted = !vv.muted; atualizarSom(); }
  });

  // Dica curta na 1.ª visita
  function mostrarDica() {
    try { if (localStorage.getItem('dicaReels')) return; localStorage.setItem('dicaReels', 1); } catch (e) {}
    const d = document.getElementById('dica');
    d.textContent = matchMedia('(hover: none)').matches ? 'Toca para ouvir · Toque duplo para ecrã inteiro' : 'Clica para ouvir · Duplo clique para ecrã inteiro';
    setTimeout(() => d.style.opacity = 1, 800);
    setTimeout(() => d.style.opacity = 0, 5000);
  }

  window.addEventListener('resize', colunas);
  document.addEventListener('touchstart', () => document.querySelectorAll('video[src]').forEach(v => { if (v.paused && v.closest('.reel') ) v.play().catch(()=>{}); }), { once: true, passive: true });
</script>
</body>
